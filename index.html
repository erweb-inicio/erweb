<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERWEB | Creación de páginas web</title>

    <meta name="description"
        content="ERWEB - Creación de páginas web modernas, profesionales y adaptadas a celulares para empresas y emprendimientos.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <style>

        /* =========================
           CONFIGURACIÓN GENERAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #07111f;
            color: white;
            overflow-x: hidden;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            height: 75px;

            background: rgba(5, 12, 23, 0.94);

            backdrop-filter: blur(12px);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            z-index: 1000;

            border-bottom: 1px solid rgba(255,255,255,0.08);
        }


        .logo {

            font-size: 30px;

            font-weight: 800;

            letter-spacing: 2px;

            color: white;

            text-decoration: none;
        }


        .logo span {

            color: #00b7ff;
        }


        nav {

            display: flex;

            gap: 28px;
        }


        nav a {

            color: white;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            transition: 0.3s;
        }


        nav a:hover {

            color: #00b7ff;
        }


        .menu-btn {

            display: none;

            font-size: 30px;

            cursor: pointer;

            color: white;

            user-select: none;
        }



        /* =========================
           HERO
        ========================= */

        .hero {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 120px 20px 70px;

            background:

                radial-gradient(
                    circle at 20% 30%,
                    rgba(0,183,255,0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 70%,
                    rgba(0,90,255,0.18),
                    transparent 30%
                ),

                #07111f;
        }


        .hero-content {

            max-width: 900px;
        }


        .hero small {

            color: #00b7ff;

            font-weight: 700;

            letter-spacing: 3px;

            font-size: 12px;
        }


        .hero h1 {

            font-size: clamp(45px, 7vw, 82px);

            line-height: 1.05;

            margin: 25px 0;

            font-weight: 800;
        }


        .hero h1 span {

            color: #00b7ff;
        }


        .hero p {

            max-width: 700px;

            margin: auto;

            color: #c6d0dc;

            font-size: 18px;

            line-height: 1.7;
        }



        /* =========================
           SECCIONES
        ========================= */

        section {

            padding: 100px 7%;
        }


        .section-title {

            text-align: center;

            margin-bottom: 60px;
